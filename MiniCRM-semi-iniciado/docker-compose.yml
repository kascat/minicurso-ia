services:
  minicrm:
    build: .
    container_name: minicrm-semi
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "3011:3011"
    environment:
      NUXT_HOST: "0.0.0.0"
      NUXT_PORT: "3011"
      DATABASE_URL: "file:../data/minicrm.db"
      AUTH_SECRET: "troque-por-uma-chave-aleatoria-de-32-bytes"
    volumes:
      - .:/app
      - ./data:/app/data
    command: >
      sh -c "npm install &&
             npx prisma generate &&
             npx prisma db push &&
             npm run db:seed &&
             npm run dev -- --host 0.0.0.0 --port 3011"
